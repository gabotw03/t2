<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Gabo design｜挑房不踩雷工具包</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--page:#f5f5f7;--fg:#1d1d1f;--mut:#86868b;--card:#f5f5f7;--ln:#e5e5ea;--btn:#1d1d1f;--btnf:#fff;--g:#1f8a5b;--y:#b7791f;--r:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--page:#000;--fg:#f5f5f7;--card:#1c1c1e;--ln:#2c2c2e;--btn:#f5f5f7;--btnf:#000;--g:#30d158;--y:#ffd60a;--r:#ff453a}}
:root[data-theme="dark"]{--bg:#0b0b0c;--page:#000;--fg:#f5f5f7;--card:#1c1c1e;--ln:#2c2c2e;--btn:#f5f5f7;--btnf:#000;--g:#30d158;--y:#ffd60a;--r:#ff453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--fg);font:16px/1.65 Inter,"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-weight:300;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
#app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 24px 48px -12px rgba(0,0,0,.08)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:16px 28px 0}
.top .r{display:flex;justify-content:space-between;align-items:center;height:28px}.top b{font-size:12px;font-weight:600;letter-spacing:.3em}
.back{background:none;border:0;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;padding:4px 0}
.prog{height:2px;background:var(--ln);margin-top:12px}.prog i{display:block;height:100%;background:var(--fg);transition:width .4s cubic-bezier(.16,1,.3,1)}.vh{visibility:hidden}
main{flex:1;padding:36px 28px 56px;animation:in .32s cubic-bezier(.16,1,.3,1)}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.eb{font-size:12px;letter-spacing:.2em;color:var(--mut);font-weight:500;text-transform:uppercase;margin-bottom:12px}
h1{font-size:34px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:0 0 16px}h2{font-size:26px;line-height:1.25;font-weight:600;letter-spacing:-.015em;margin:0 0 12px}h3{font-size:16px;font-weight:500;margin:0}
.sub{color:var(--mut);font-size:15px;margin:0 0 32px}.mut{color:var(--mut);font-size:13px}
.btn{display:block;width:100%;background:var(--btn);color:var(--btnf);border:0;border-radius:99px;padding:16px 24px;font:inherit;font-weight:500;cursor:pointer;text-align:center;text-decoration:none;transition:transform .2s,opacity .2s}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.25;cursor:not-allowed}.btn.o{background:none;color:var(--fg);border:1px solid var(--ln)}
.lnk{background:none;border:0;color:var(--mut);font:inherit;font-size:14px;padding:16px 0;width:100%;cursor:pointer}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:20px 22px;margin:10px 0;background:var(--card);border:1.5px solid transparent;border-radius:18px;font:inherit;color:var(--fg);cursor:pointer;transition:.25s}
.opt:hover,.opt.on{border-color:var(--fg)}.opt:active{transform:scale(.985)}.opt b{font-weight:500;display:block}.opt small{color:var(--mut);font-size:13px}.opt i{width:9px;height:9px;border-radius:9px;border:1.5px solid var(--mut);flex:none;margin-left:14px}.opt.on i{background:var(--fg);border-color:var(--fg)}
.num{display:flex;align-items:baseline;justify-content:center;margin:24px 0 44px}.num input{width:190px;font:200 72px/1.25 Inter,sans-serif;letter-spacing:0;text-align:center;color:var(--fg);background:none;border:0;border-bottom:1px solid var(--ln);outline:0;padding:0 6px 6px;overflow:visible;-moz-appearance:textfield}.num input:focus{border-color:var(--fg)}.num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{-webkit-appearance:none}.num span{font-size:20px;color:var(--mut);margin-left:8px}
.chips{display:flex;gap:8px;justify-content:center;margin:-20px 0 36px}.chips button{background:var(--card);border:0;border-radius:99px;padding:8px 16px;font:inherit;font-size:14px;color:var(--fg);cursor:pointer}
.hero{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 150px)}
.dark{background:#09090b;color:#f5f5f7;border-radius:24px;padding:28px;margin-bottom:16px}.dark .mut{color:#8e8e93}
.score{display:flex;align-items:center;gap:22px;padding-bottom:24px;border-bottom:1px solid #2c2c2e}.big{font:200 64px/1 Inter,sans-serif;letter-spacing:-.04em}
.row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--ln);font-size:15px}.row:last-child{border:0}.row span:last-child{color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:9px;margin-right:10px}
.fl{background:var(--card);border-radius:18px;padding:20px;margin:10px 0}.fl p{margin:6px 0 0;font-size:14px;color:var(--mut)}.fl .c{margin-top:12px;padding-top:12px;border-top:1px solid var(--ln);color:var(--fg)}
.pro{border:1.5px solid var(--fg);border-radius:24px;padding:26px;margin:28px 0 16px}.lk{filter:blur(5px);user-select:none;opacity:.8}
.pr{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px}.pr b{font:200 44px/1 Inter,sans-serif;letter-spacing:-.04em}
.bar{height:2px;background:#2c2c2e;position:relative;overflow:hidden;margin-top:28px}.bar:after{content:"";position:absolute;left:-40%;width:40%;height:100%;background:#f5f5f7;animation:sw 1.2s cubic-bezier(.16,1,.3,1) infinite}@keyframes sw{to{left:100%}}
.mk{height:20px;display:block}.lg{display:block;width:92px;margin:0 auto 44px}.ft{width:92px;margin:28px auto 6px;display:block;opacity:.9}
.lgd{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgl{display:none}:root:not([data-theme="light"]) .lgd{display:block}}:root[data-theme="dark"] .lgl{display:none}:root[data-theme="dark"] .lgd{display:block}
.ac{background:var(--card);border-radius:20px;margin:10px 0;overflow:hidden}.ac summary{list-style:none;display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer}.ac summary::-webkit-details-marker{display:none}.ac summary::marker{content:""}
.no{font:200 24px/1 Inter,sans-serif;color:var(--mut);width:28px;flex:none}.tt{flex:1;min-width:0}.tt b{display:block;font-weight:500;font-size:16px;line-height:1.4}
.im{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.im em{font-style:normal;font-size:11px;color:var(--mut);border:1px solid var(--ln);border-radius:99px;padding:0 9px}
.sv{font-size:11px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap;flex:none}.s1{color:var(--r);background:color-mix(in srgb,var(--r) 13%,transparent)}.s2{color:var(--y);background:color-mix(in srgb,var(--y) 14%,transparent)}.s3{color:var(--mut);background:var(--ln)}
.ch{width:7px;height:7px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:rotate(45deg);transition:transform .3s;flex:none;margin:0 4px 4px 0}details[open] .ch{transform:rotate(-135deg);margin:4px 4px 0 0}
.bd{padding:0 20px 22px 62px}.lb{font-size:11px;letter-spacing:.14em;color:var(--mut);margin:16px 0 6px}.bd p{margin:0;font-size:14px;color:var(--fg);line-height:1.7}
.ck{display:flex;gap:12px;font-size:14px;cursor:pointer;align-items:flex-start;line-height:1.7}.ck input{display:none}.ck span{flex:none;width:20px;height:20px;border:1.5px solid var(--mut);border-radius:7px;margin-top:2px;transition:.2s}.ck input:checked+span{background:var(--fg);border-color:var(--fg);box-shadow:inset 0 0 0 3px var(--bg)}
.sm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px;font-size:13px;color:var(--mut)}
.st{display:grid;grid-template-columns:repeat(3,1fr);border-top:.5px solid var(--ln);border-bottom:.5px solid var(--ln);margin-top:8px}.st>div{padding:18px 0 16px 14px;border-left:.5px solid var(--ln)}.st>div:first-child{border:0;padding-left:0}.st b{display:block;font:200 38px/1.1 Inter,sans-serif;letter-spacing:-.03em}.st span{font-size:12px;color:var(--mut)}
.list2>div{display:flex;align-items:center;gap:16px;padding:15px 0;border-bottom:.5px solid var(--ln);font-size:16px;font-weight:400}.list2 i{font:200 15px Inter,sans-serif;font-style:normal;color:var(--mut)}
.brd{line-height:0;margin:4px 0 40px}.brd img{width:60px;height:auto;margin:0}.brd span{font-size:15px;font-weight:500;letter-spacing:.14em;padding-left:14px;border-left:.5px solid var(--ln);line-height:1.2}
#app{min-height:100vh;min-height:100dvh}main{padding:20px 28px 28px}.eb{margin:20px 0 10px}.sub{margin:0 0 22px}h2{font-size:24px;margin:0 0 8px}
.opt{padding:16px 20px;margin:8px 0}.num{margin:10px 0 26px}.chips{margin:-10px 0 22px}
.opt{justify-content:flex-start;gap:16px}.ot{flex:1}.ol{font:500 12px/1 Inter,sans-serif;font-style:normal;width:28px;height:28px;border-radius:9px;border:1px solid var(--ln);display:grid;place-items:center;color:var(--mut);flex:none;transition:.2s}.opt.on .ol,.opt:hover .ol{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dg>div{background:var(--card);border-radius:16px;padding:16px 18px}.dg small{display:block;color:var(--mut);font-size:12px;letter-spacing:.1em;margin-bottom:4px}.dg b{font-weight:500;font-size:16px;display:flex;align-items:center}
.pk>div{display:flex;gap:14px;padding:14px 0;border-bottom:.5px solid var(--ln)}.pk>div:last-child{border:0}.pk i{font:200 15px/1.5 Inter,sans-serif;font-style:normal;color:var(--mut);width:22px;flex:none}.pk span{flex:1;min-width:0}.pk b{font-weight:500;font-size:15px;display:block}.pk small{color:var(--mut);font-size:13px;display:block;line-height:1.55;margin-top:2px}.pk em{font-style:normal;font-size:11px;border:1px solid var(--ln);border-radius:99px;padding:1px 9px;color:var(--mut);white-space:nowrap;align-self:flex-start;margin-top:2px}
</style></head><body><div id="app"></div>
